# Push a tag vX.Y.Z (matching VERSION in backup-gate, with a CHANGELOG entry) to publish a release:
# a source tarball, its SHA-256, a build provenance attestation, and the Homebrew formula.
name: Release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation (Sigstore)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, VERSION and CHANGELOG agree
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$(sed -n 's/^VERSION=//p' backup-gate)" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION in backup-gate"; exit 1; }
          grep -q "^## $v (20[0-9][0-9]-[0-9][0-9]-[0-9][0-9])$" CHANGELOG.md || { echo "::error::CHANGELOG.md needs '## $v (YYYY-MM-DD)'"; exit 1; }

      - name: Tests
        run: bash tests/run.sh

      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          git archive --format=tar.gz --prefix="backup-gate-$v/" -o "dist/backup-gate-$v.tar.gz" "$GITHUB_SHA"
          (cd dist && shasum -a 256 "backup-gate-$v.tar.gz" > SHA256SUMS)
          sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/" packaging/homebrew/backup-gate.rb > dist/backup-gate.rb
          ruby -c dist/backup-gate.rb
          awk -v v="$v" 'index($0, "## " v " ") == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "**Verify** (needs the GitHub CLI):"
            echo '```'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify backup-gate-$v.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> dist/notes.md

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/backup-gate-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "backup-gate ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md dist/backup-gate-*.tar.gz dist/SHA256SUMS dist/backup-gate.rb
